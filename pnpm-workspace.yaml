overrides:
  esbuild: 0.28.2
  vite: "catalog:"

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.13"
  - "@turbo/darwin-arm64@2.10.13"
  - "@turbo/linux-64@2.10.13"
  - "@turbo/linux-arm64@2.10.13"
  - "@turbo/windows-64@2.10.13"
  - "@turbo/windows-arm64@2.10.13"
  - turbo@2.10.13
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vite-plus: 0.3.2
  # vite-plus bundles Vitest 4.1.11; its coverage provider must match exactly.
  "@vitest/coverage-v8": 4.1.11
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
