name: Select release environment

on:
  workflow_call:
    inputs:
      protected-environment:
        required: true
        type: string
      admin-environment:
        required: true
        type: string
    outputs:
      environment:
        description: Environment selected for the caller.
        value: ${{ jobs.resolve.outputs.environment }}
      reason:
        description: Why that environment was selected.
        value: ${{ jobs.resolve.outputs.reason }}

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve merged PR author
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.select.outputs.environment }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_ENVIRONMENT: ${{ inputs.protected-environment }}
          ADMIN_ENVIRONMENT: ${{ inputs.admin-environment }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          environment="$PROTECTED_ENVIRONMENT"
          reason="no-associated-merged-pull-request"
          pr_data="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"${BASE_BRANCH}\")][0] | select(.) | [.number, .user.login] | @tsv" \
              2>/dev/null || true
          )"

          if [[ -n "$pr_data" ]]; then
            IFS=$'\t' read -r pr_number pr_author <<<"$pr_data"
            permission="$(
              gh api "repos/${GITHUB_REPOSITORY}/collaborators/${pr_author}/permission" \
                --jq '.permission' 2>/dev/null || true
            )"
            if [[ "$permission" == "admin" ]]; then
              environment="$ADMIN_ENVIRONMENT"
              reason="admin-author-of-merged-pull-request-${pr_number}"
            else
              reason="non-admin-author-of-merged-pull-request-${pr_number}"
            fi
          fi

          echo "Selected ${environment}: ${reason}"
          echo "environment=${environment}" >>"$GITHUB_OUTPUT"
          echo "reason=${reason}" >>"$GITHUB_OUTPUT"
