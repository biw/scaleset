name: Publish npm package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  environment:
    uses: ./.github/workflows/release-environment.yml
    with:
      protected-environment: npm
      admin-environment: npm-admin
      allow-admin-actor-without-pr: true

  publish:
    needs: environment
    name: Verify and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: actions-scaleset/go.mod
          cache: true
          cache-dependency-path: actions-scaleset/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm check
      - run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - run: npm publish
