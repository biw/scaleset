name: Publish npm package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: actions-scaleset/go.mod
          cache: true
          cache-dependency-path: actions-scaleset/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm check
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          expected_tag="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not point to a commit on main."
            exit 1
          fi
      - run: npm publish
