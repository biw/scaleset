name: Protected E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  # The provider's finally block removes its scale set; do not interrupt it.
  cancel-in-progress: false

jobs:
  environment:
    name: Select protected environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGERING_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          environment="e2e"
          pr_author=""
          pr_data="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"${BASE_BRANCH}\")][0] | select(.) | .user.login" \
              2>/dev/null || true
          )"

          if [[ -n "$pr_data" ]]; then
            pr_author="$pr_data"
          fi

          admin_candidate="${pr_author:-$TRIGGERING_ACTOR}"
          permission="$(
            gh api "repos/${GITHUB_REPOSITORY}/collaborators/${admin_candidate}/permission" \
              --jq '.permission' 2>/dev/null || true
          )"
          if [[ "$permission" == "admin" ]]; then
            environment="e2e-admin"
          fi

          echo "Selected ${environment} for ${admin_candidate}."
          echo "environment=${environment}" >>"$GITHUB_OUTPUT"

  e2e:
    needs: environment
    name: Run live scale-set providers
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: actions-scaleset/go.mod
          cache: true
          cache-dependency-path: actions-scaleset/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
        env:
          E2E_SCALESET_URL: ${{ format('https://github.com/{0}', github.repository) }}
          E2E_SCALESET_NAME: scaleset-e2e-${{ github.run_id }}
          E2E_SCALESET_RUNNER_GROUP: default
          E2E_SCALESET_MIN_RUNNERS: "0"
          E2E_SCALESET_MAX_RUNNERS: "1"
          E2E_SCALESET_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_WORKFLOW_TARGET_ORG: ${{ github.repository_owner }}
          E2E_WORKFLOW_TARGET_REPO: ${{ github.event.repository.name }}
          E2E_WORKFLOW_TARGET_FILE: e2e-target.yml
          E2E_WORKFLOW_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
